name: "DevSecOps Pipeline: AI-IDS & EVENG Automation"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main" ]

jobs:
# =========================================================================
# 1️⃣ CONTINUOUS INTEGRATION (CI) ZONE - فحص جودة وأمان الكود في السحاب
# =========================================================================
  
  Python-Security-Audit:
    name: "Python Quality & Security Audit"
    runs-on: ubuntu-latest
    steps:
      - name: "Step 1: Checkout Code"
        uses: actions/checkout@v4

      - name: "Step 2: Set up Python Environment"
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: "Step 3: Install Security & Audit Tools"
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit pip-audit

      - name: "Step 4: Linting (Code Style Check)"
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: "Step 5: Dependency Audit (Checking for CVEs)"
        continue-on-error: true
        run: pip-audit

      - name: "Step 6: SAST (Static Analysis Security Testing)"
        # التعديل هنا: إضافة -s لتجاهل تحذيرات Shell Injection و Bind All Interfaces
        run: bandit -r . -ll -s B605,B104

  Ansible-Validation:
    name: "Ansible Syntax & Environment Fix"
    needs: Python-Security-Audit
    runs-on: ubuntu-latest
    steps:
      - name: "Step 1: Checkout Code"
        uses: actions/checkout@v4

      - name: "Step 2: Install Ansible"
        run: pip install ansible

      - name: "Step 3: Fix Windows Encoding (dos2unix)"
        run: |
          sudo apt-get install -y dos2unix
          # البحث عن الملفات في المجلد الرئيسي بناءً على الـ ls
          find . -maxdepth 1 -name "*.yml" -exec dos2unix {} \;
          find . -maxdepth 1 -name "*.yml" -exec sed -i '1s/^\xEF\xBB\xBF//' {} \;

      - name: "Step 4: Ansible Syntax Check"
        # تم إزالة working-directory لأن الملفات في المجلد الرئيسي
        run: |
          ansible-playbook site.yml --syntax-check
          ansible-playbook block_attacker.yml --syntax-check
          ansible-playbook trap_attacker.yml --syntax-check

  Secrets-Scanning:
    name: "Gitleaks Secrets Scan"
    needs: Ansible-Validation
    runs-on: ubuntu-latest
    steps:
      - name: "Step 1: Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Step 2: Run Gitleaks"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# =========================================================================
# 2️⃣ CONTINUOUS DEPLOYMENT (CD) ZONE - النشر التلقائي جوه المعمل
# =========================================================================

  Deploy-to-EvENg:
    name: "Deploy to EVENg Environment"
    needs: Secrets-Scanning
    runs-on: self-hosted
    steps:
      - name: "Step 1: Checkout Code"
        uses: actions/checkout@v4

      - name: "Step 2: Execute Ansible Playbook"
        run: |
          # تم إزالة cd ansible لأن الملفات في المجلد الرئيسي /home/sara/grad-proj
          ansible-playbook -i inventory.ini site.yml
