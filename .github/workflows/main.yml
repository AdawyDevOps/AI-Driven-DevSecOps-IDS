name: "DevSecOps Pipeline: AI-IDS & EVENG Automation"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main" ]

jobs:
# =========================================================================
# 1️⃣ CONTINUOUS INTEGRATION (CI) ZONE
# =========================================================================

  # المرحلة الأولى: فحص أمان البايثون
  Python-Security-Audit:
    name: "Python Quality & Security Audit"
    runs-on: ubuntu-latest
    steps:
      - name: "Step 1: Checkout Code"
        uses: actions/checkout@v4
      - name: "Step 2: Set up Python Environment"
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: "Step 3: Install Security Tools"
        run: pip install flake8 bandit pip-audit
      - name: "Step 4: SAST (Bandit Scan)"
        # تم إضافة -s لتجاوز التحذيرات المعروفة في الـ Webhook لضمان علامة النجاح الخضراء
        run: bandit -r . -ll -s B605,B104

  # المرحلة الثانية: فحص ملفات Ansible
  Ansible-Validation:
    name: "Ansible Syntax Check"
    needs: Python-Security-Audit
    runs-on: ubuntu-latest
    steps:
      - name: "Step 1: Checkout Code"
        uses: actions/checkout@v4
      - name: "Step 2: Install Ansible"
        run: pip install ansible
      - name: "Step 3: Ansible Syntax Check"
        working-directory: ./ansible
        run: |
          ansible-playbook site.yml --syntax-check
          ansible-playbook block_attacker.yml --syntax-check
          ansible-playbook trap_attacker.yml --syntax-check

  # المرحلة الثالثة: فحص تسريبات الأسرار (Gitleaks)
  Secrets-Scanning:
    name: "Gitleaks Secrets Scan"
    needs: Ansible-Validation
    runs-on: ubuntu-latest
    steps:
      - name: "Step 1: Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Step 2: Run Gitleaks"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# =========================================================================
# 2️⃣ CONTINUOUS DEPLOYMENT (CD) ZONE
# =========================================================================

  Deploy-to-EvENg:
    name: "Deploy to EVENg Environment"
    needs: Secrets-Scanning
    runs-on: self-hosted
    steps:
      - name: "Step 1: Checkout Code"
        uses: actions/checkout@v4

      - name: "Step 2: Execute Ansible Playbook"
        working-directory: ./ansible 
        run: |
          ansible-playbook -i inventory.ini site.yml

     
      - name: Slack Notification
        if: always() # يرسل التنبيه دائماً ليخبرك بالنجاح أو الفشل
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_TITLE: "Project: AI-IDS DevSecOps 🛡️"
          SLACK_MESSAGE: |
            *Audit Status:* ${{ job.status }}
            *Result:* The security checks finished with status: `${{ job.status }}`
            *Action:* Review logs if there are any failures.
          SLACK_COLOR: ${{ job.status }}
          SLACK_USERNAME: GitHub Bot
          MSG_MINIMAL: true
